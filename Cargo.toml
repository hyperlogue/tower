[workspace]
resolver = "3"
members = [
    "crates/tower-protocol",
    "crates/tower-pal",
    "crates/tower-pool-proto",
    "crates/tower-pool",
    "crates/tower-store",
    "crates/tower-sessions",
    "crates/tower-terminal",
    "crates/tower-runtime",
    "crates/tower-agents",
    "crates/towerd",
    "crates/tower",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
# Enable protocol publication once its first compatibility contract is ready.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
subtle = "2"
getrandom = "0.4"
tempfile = "3"
tower-protocol = { path = "crates/tower-protocol" }
tower-pal = { path = "crates/tower-pal" }
tower-store = { path = "crates/tower-store" }
towerd = { path = "crates/towerd" }
tower-pool-proto = { path = "crates/tower-pool-proto" }
tower-pool = { path = "crates/tower-pool" }
tower-agents = { path = "crates/tower-agents" }
tower-sessions = { path = "crates/tower-sessions" }
tower-terminal = { path = "crates/tower-terminal" }
tower-runtime = { path = "crates/tower-runtime" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
strip = true
lto = "thin"
