[package]
name = "tower-pal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Platform interfaces for terminal, IPC, process, and daemon operations."

[lints]
workspace = true

[features]
default = []
terminal = ["nix/term"]

[dependencies]
notify = "8"
tokio.workspace = true
tempfile.workspace = true
fs2 = "0.4"
signal-hook = "0.3"
rustix = { version = "1", features = ["process", "time"] }
nix = { version = "0.31", features = ["process", "signal", "fs", "socket", "user", "poll"] }
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
