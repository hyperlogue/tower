[package]
name = "tower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Server, CLI, and terminal pool entry points for Tower."
autobins = false
default-run = "tower-cli"

[[bin]]
name = "tower"
path = "src/server.rs"

[[bin]]
name = "tower-cli"
path = "src/main.rs"

[[bin]]
name = "tower-terminal-pool"
path = "src/terminal_pool.rs"

[lints]
workspace = true

[dependencies]
tower-clipboard.workspace = true
tower-runtime.workspace = true
tower-sessions.workspace = true
tower-agents.workspace = true
tower-terminal.workspace = true
tower-protocol.workspace = true
tower-pal.workspace = true
towerd.workspace = true
tower-pool-proto.workspace = true
tower-pool.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true

[dev-dependencies]
sha2.workspace = true
tokio-tungstenite = "0.28"
futures-util = "0.3"
tempfile.workspace = true
rusqlite.workspace = true
