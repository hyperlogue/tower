description = "Local registry, session orchestration, delivery, and API daemon."

[lints]
workspace = true

[dependencies]
tower-vcs.workspace = true
tower-clipboard.workspace = true
tower-protocol.workspace = true
tower-pal.workspace = true
tower-store.workspace = true
tower-sessions.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
thiserror.workspace = true
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
base64 = "0.22"
time = { version = "0.3", features = ["parsing"] }

axum = "0.8"
async-stream = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
